<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="redStem" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B20710"/>
      <stop offset="100%" stop-color="#E50914"/>
    </linearGradient>
    <linearGradient id="redDiagonalLeft" x1="12" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="50%" stop-color="#FF2E3B"/>
      <stop offset="100%" stop-color="#B20710"/>
    </linearGradient>
    <linearGradient id="redDiagonalRight" x1="52" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="50%" stop-color="#FF2E3B"/>
      <stop offset="100%" stop-color="#B20710"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="#E50914" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Iconic Netflix-Style Bold M Ribbon -->
  <g filter="url(#shadow)">
    <!-- Left Vertical Column -->
    <path d="M12 10H20V54H12V10Z" fill="url(#redStem)"/>
    
    <!-- Right Vertical Column -->
    <path d="M44 10H52V54H44V10Z" fill="url(#redStem)"/>
    
    <!-- Left Diagonal Ribbon (Overlapping left to center) -->
    <path d="M12 10H20L34 44H26L12 10Z" fill="url(#redDiagonalLeft)"/>
    
    <!-- Right Diagonal Ribbon (Overlapping right to center) -->
    <path d="M52 10H44L30 44H38L52 10Z" fill="url(#redDiagonalRight)"/>
  </g>
</svg>